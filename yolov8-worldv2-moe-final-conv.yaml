# MoE-YOLOWorld 最终版（标准 3x3 Conv 专家）- X版本
# - backbone 4 个 C2f -> MoE_C2f_final_conv
#     每个内部 = 1 个共享 Conv 专家 + 8 个路由 Conv 专家 + 跨模态门控（Top-2）
# - 专家结构与原 YOLO-World Bottleneck 第二个 3x3 卷积形状一致，
#   可由 init_moe_final_conv_from_pretrained.py 从 yolov8x-worldv2.pt 直接继承权重
#   （论文 §3.7.1 公式 (3.29) 的 "近复制 + 高斯微扰" 初始化）
# - head 仍保留 YOLO-World 原版 RepVL-PAN（C2fAttn）
# - 多层级负载均衡损失在 v8_world_DetectionLoss 中处理（与 final 版一致）

nc: 1203  # LVIS数据集类别数
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# args 含义：[c2, shortcut, num_routing, top_k, text_dim]
# 重复次数 n 由 ultralytics parse_model 注入到第 3 个位置（与 C2f 一致）

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                               # 1-P2/4
  - [-1, 3, MoE_C2f_final_conv, [128, True, 8, 2, 512]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]                               # 3-P3/8
  - [-1, 6, MoE_C2f_final_conv, [256, True, 8, 2, 512]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]                               # 5-P4/16
  - [-1, 6, MoE_C2f_final_conv, [512, True, 8, 2, 512]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]                              # 7-P5/32
  - [-1, 3, MoE_C2f_final_conv, [1024, True, 8, 2, 512]]     # 8
  - [-1, 1, SPPF, [1024, 5]]                                 # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                                # cat backbone P4
  - [-1, 3, C2fAttn, [512, 256, 8]]                          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                                # cat backbone P3
  - [-1, 3, C2fAttn, [256, 128, 4]]                          # 15 (P3/8-small)

  - [15, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]                               # cat head P4
  - [-1, 3, C2fAttn, [512, 256, 8]]                          # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]                                # cat head P5
  - [-1, 3, C2fAttn, [1024, 512, 16]]                        # 21 (P5/32-large)

  - [[15, 18, 21], 1, WorldDetect, [nc, 512, True]]          # Detect(P3, P4, P5)