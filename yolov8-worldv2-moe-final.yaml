# MoE-YOLOWorld 最终版（论文第三章）
# - backbone 4 个 C2f -> MoE_C2f_final（每个内部含 1 个共享 DWConv 专家 + 8 个路由 DWConv 专家
#   + 跨模态 Max-Sigmoid 融合门控 + Top-2 路由 + loss-free bias）
# - head 保留 YOLO-World 原版 RepVL-PAN（C2fAttn）
# - 多层级负载均衡 loss 在 v8_world_DetectionLoss 中实现（局部熵 + 全局熵）

nc: 80  # number of classes
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# args 含义：[c2, shortcut, num_routing, top_k, text_dim]
# 重复次数 n 由 ultralytics parse_model 注入到第 3 个位置（与 C2f 一致）

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 1-P2/4
  - [-1, 3, MoE_C2f_final, [128, True, 8, 2, 512]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                             # 3-P3/8
  - [-1, 6, MoE_C2f_final, [256, True, 8, 2, 512]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]                             # 5-P4/16
  - [-1, 6, MoE_C2f_final, [512, True, 8, 2, 512]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]                            # 7-P5/32
  - [-1, 3, MoE_C2f_final, [1024, True, 8, 2, 512]]        # 8
  - [-1, 1, SPPF, [1024, 5]]                               # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                              # cat backbone P4
  - [-1, 3, C2fAttn, [512, 256, 8]]                        # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                              # cat backbone P3
  - [-1, 3, C2fAttn, [256, 128, 4]]                        # 15 (P3/8-small)

  - [15, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]                             # cat head P4
  - [-1, 3, C2fAttn, [512, 256, 8]]                        # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]                              # cat head P5
  - [-1, 3, C2fAttn, [1024, 512, 16]]                      # 21 (P5/32-large)

  - [[15, 18, 21], 1, WorldDetect, [nc, 512, True]]        # Detect(P3, P4, P5)
